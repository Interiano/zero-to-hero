<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zero-To-Hero Habit Tracker</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">

    <div class="app-header">
      <h1>Zero-To-<span>Hero</span></h1>
      <p class="tagline">Track your habits. Build your future.</p>
    </div>

    <div class="form-section">
      <h2>Create a habit</h2>

      <form id="habitForm">
        <label for="userId">User ID</label>
        <input type="text" id="userId" placeholder="e.g. user-001" required>

        <label for="habitName">Habit Name</label>
        <input type="text" id="habitName" placeholder="e.g. Morning Run" required>

        <label for="frequency">Frequency</label>
        <select id="frequency">
          <option value="daily">Daily</option>
          <option value="weekly">Weekly</option>
        </select>

        <button type="submit" class="btn-primary">Create Habit</button>
      </form>

      <div id="message"></div>
    </div>

    <div class="habits-section">
      <div class="habits-header">
        <h2>My Habits</h2>
        <button id="loadHabits" class="btn-secondary">Load Habits</button>
      </div>
      <ul id="habits"></ul>
    </div>

  </div>

  <script src="app.js"></script>
</body>
</html>
